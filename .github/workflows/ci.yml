name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Change-aware CI. The `Detect changes` job classifies the PR diff into
# domains; each check below runs only when the diff can plausibly affect
# its domain. Pushes to main always run the full suite.
#
# Gating uses job-level `if:` (never workflow-level `paths:` filters): a
# skipped job reports Success and satisfies required checks, while a
# filtered-out workflow would leave them pending forever. The classifier
# fails safe: an uncomputable diff or an unrecognized path runs
# everything.
#
# Domains:
#   app — format/lint/typecheck/unit tests/build (npm run check)
#   db  — docker-compose Postgres: migration replay, drift check, db
#         tests, restore drill
#   e2e — Playwright smoke suite (runs inside the App job; the smoke
#         webServer needs the production build, so e2e implies the app
#         check which produces it)
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.classify.outputs.app }}
      db: ${{ steps.classify.outputs.db }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          app=false
          db=false
          e2e=false
          files=""

          run_all() {
            app=true; db=true; e2e=true
          }

          if [ "$EVENT_NAME" = "push" ]; then
            # Full run on main.
            run_all
          else
            files="$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null)" || files=""
            if [ -z "$files" ]; then
              # A real PR always has a diff; empty means the diff failed.
              # Fail safe toward full coverage, never toward skipping it.
              echo "::warning::Could not compute PR diff — running all domains"
              run_all
            fi
            while IFS= read -r f; do
              [ -z "$f" ] && continue

              # Cheap validation for config-only changes that no longer
              # get exercised indirectly by a heavy suite.
              case "$f" in
                *.json)
                  node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" || exit 1
                  ;;
                .github/workflows/*.yml|.github/workflows/*.yaml)
                  if python3 -c "import yaml" 2>/dev/null; then
                    python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || exit 1
                  else
                    echo "::warning::PyYAML unavailable; skipping workflow YAML validation for $f"
                  fi
                  ;;
              esac

              case "$f" in
                # Docs / metadata / CI config: cannot affect runtime.
                *.md|LICENSE|docs/*|runbooks/*|.github/*|.vscode/*|.env*|.gitignore|.gitattributes|.prettier*|vercel.json)
                  ;;

                # Postgres schema, migrations and DB-coupled tooling: the
                # generated client feeds build/tests, and the Database job
                # replays migrations + drills restore.
                prisma/*|docker-compose.yml|vitest.db.config.ts|*.db.test.*|src/lib/db/*|scripts/backup-database*|scripts/restore-drill*|scripts/wait-for-postgres*|scripts/provision-admin*|scripts/lib/*)
                  db=true; app=true ;;

                # Playwright suite/config itself: needs the app build the
                # `check` gate produces (CI webServer = `next start`).
                smoke-tests/*|playwright.config.ts)
                  app=true; e2e=true ;;

                # Unit-test-only changes exercise the vitest suite.
                *.test.*)
                  app=true ;;

                # Application runtime — user-visible and smoke-relevant.
                src/*|public/*|next.config.ts|postcss.config.mjs|sentry.server.config.ts|instrumentation.ts|instrumentation-client.ts)
                  app=true; e2e=true ;;

                # Install/build/dependency surface: full coverage.
                package.json|package-lock.json|.nvmrc|.npmrc)
                  run_all ;;

                # Lint/test config and ops scripts: app gate.
                eslint.config.mjs|vitest.config.ts|tsconfig.json|components.json|scripts/*)
                  app=true ;;

                # Unknown change: run everything.
                *)
                  run_all ;;
              esac
            done <<< "$files"
          fi

          echo "Changed files:"
          echo "$files"
          echo "Domains: app=$app db=$db e2e=$e2e"
          {
            echo "app=$app"
            echo "db=$db"
            echo "e2e=$e2e"
          } >> "$GITHUB_OUTPUT"

  # Core gates: install from the lockfile, then the full check suite —
  # format, lint, typecheck, unit tests, production build — running with
  # zero secrets. The browser smoke suite reuses the build output.
  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Playwright Chromium
        if: needs.changes.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        if: needs.changes.outputs.e2e == 'true'
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() && needs.changes.outputs.e2e == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  # Database gates against the docker-compose Postgres: replay every
  # migration onto an empty database, diff migration history against
  # schema.prisma (drift check), run the isolated db test suite, and
  # prove the backup path with a restore drill.
  database:
    name: Database
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # pg_isready probes the unix socket and can report "ready" against
      # the entrypoint's temporary initdb server, which then shuts down —
      # racing createdb. db:wait requires real TCP queries instead.
      - name: Start PostgreSQL
        run: |
          docker compose up -d postgres
          npm run db:wait
      - name: Migration replay + schema drift check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/sarbase_dev
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/shadow
        run: |
          docker compose exec -T postgres createdb -U postgres shadow
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - name: Database tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/sarbase_test
        run: |
          docker compose exec -T postgres createdb -U postgres sarbase_test
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
          npm run test:db
      - name: Restore drill
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/sarbase_dev
        run: npm run db:restore-drill -- --target development --confirm
