# Local development PostgreSQL. Runs on 5433 to avoid colliding with any
# system Postgres on 5432. This is disposable synthetic-data storage —
# never point it at production, never restore production dumps into a
# shared dev database without a sanitization step.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sarbase_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
